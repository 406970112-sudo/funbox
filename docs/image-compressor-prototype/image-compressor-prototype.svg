    <text x="958" y="376" class="tiny bold softLight">压缩后</text><text x="958" y="397" class="latin white" font-size="12" font-weight="700">2.7 MB</text>
    <text x="1065" y="376" class="tiny bold softLight">图片数</text><text x="1065" y="397" class="latin white" font-size="12" font-weight="700">3 张</text>

    <text x="816" y="493" class="sectionTitle">文件列表</text>
    <text x="1174" y="493" text-anchor="end" class="tiny bold muted">2 张完成 · 1 张处理中</text>

    <rect x="814" y="547" width="362" height="82" rx="17" fill="#fff" stroke="#dce5f7"/>
    <rect x="826" y="558" width="58" height="58" rx="12" fill="#cbd8ee"/>
    <image x="826" y="558" width="58" height="58" preserveAspectRatio="xMidYMid slice" clip-path="url(#thumbA)" href="thumb-landscape.jpg" xlink:href="thumb-landscape.jpg"/>
    <text x="896" y="573" class="small bold">mountain-trip.jpg</text>
    <text x="896" y="597" class="latin tiny medium muted">4.8 MB</text><use xlink:href="#i-arrow" x="930" y="588" width="11" height="11" style="color:#9aa6c1"/>
    <text x="947" y="597" class="latin tiny medium muted">1.1 MB</text><text x="990" y="597" class="tiny bold green">省 77%</text>
    <rect x="1129" y="571" width="34" height="34" rx="11" fill="#edf2ff"/><use xlink:href="#i-download" x="1138" y="580" width="16" height="16" style="color:#4b6bff"/>

    <rect x="814" y="638" width="362" height="82" rx="17" fill="#fff" stroke="#dce5f7"/>
    <rect x="826" y="649" width="58" height="58" rx="12" fill="#ffced9"/>
    <image x="826" y="649" width="58" height="58" preserveAspectRatio="xMidYMid slice" clip-path="url(#thumbB)" href="thumb-icon.png" xlink:href="thumb-icon.png"/>
    <text x="896" y="664" class="small bold">funbox-icon.png</text>
    <text x="896" y="688" class="latin tiny medium muted">2.6 MB</text><use xlink:href="#i-arrow" x="930" y="679" width="11" height="11" style="color:#9aa6c1"/>
    <text x="947" y="688" class="latin tiny medium muted">820 KB</text><text x="990" y="688" class="tiny bold green">省 68%</text>
    <rect x="1129" y="662" width="34" height="34" rx="11" fill="#edf2ff"/><use xlink:href="#i-download" x="1138" y="671" width="16" height="16" style="color:#4b6bff"/>

    <rect x="814" y="729" width="362" height="82" rx="17" fill="#fff" stroke="#dce5f7"/>
    <rect x="826" y="740" width="58" height="58" rx="12" fill="#d8e5ff"/>
    <image x="826" y="740" width="58" height="58" preserveAspectRatio="xMidYMid slice" clip-path="url(#thumbC)" href="thumb-game.jpg" xlink:href="thumb-game.jpg"/>
    <text x="896" y="755" class="small bold">tetris-design.png</text>
    <text x="896" y="776" class="latin tiny medium muted">1.9 MB</text><text x="939" y="776" class="tiny bold muted">正在压缩 68%</text>
    <rect x="896" y="788" width="174" height="4" rx="2" fill="#e9eef9"/><rect x="896" y="788" width="118" height="4" rx="2" fill="#f1b643"/>
    <rect x="1129" y="753" width="34" height="34" rx="11" fill="#fff7e4"/><use xlink:href="#i-loader" x="1138" y="762" width="16" height="16" style="color:#f1b643"/>

    <rect x="799" y="843" width="392" height="121" fill="#eef4ff" fill-opacity=".97"/>
    <rect x="814" y="867" width="362" height="54" rx="17" fill="#4b6bff" filter="url(#buttonShadow)"/>
    <use xlink:href="#i-archive" x="891" y="884" width="19" height="19" style="color:#fff"/>
    <text x="921" y="901" class="white" font-size="13" font-weight="800">打包下载全部图片</text>
