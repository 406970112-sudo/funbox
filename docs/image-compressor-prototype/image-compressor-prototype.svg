    <circle cx="547" cy="248" r="4" fill="#1db991"/><circle cx="547" cy="248" r="8" fill="#1db991" fill-opacity=".12"/>
    <text x="621" y="252" text-anchor="end" class="small bold green">TinyPNG 在线</text>

    <rect x="264" y="270" width="362" height="300" rx="22" fill="#151b3b"/>
    <g opacity=".3" fill="none" stroke="#7997ff">
      <rect x="485" y="286" width="210" height="48" rx="8" transform="rotate(-13 485 286)"/>
      <rect x="187" y="516" width="210" height="48" rx="8" transform="rotate(-13 187 516)"/>
    </g>
    <rect x="409" y="306" width="72" height="72" rx="18" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".15"/>
    <use xlink:href="#i-image" x="429" y="326" width="32" height="32" style="color:#b9c6ff"/>
    <text x="445" y="418" text-anchor="middle" class="white" font-size="22" font-weight="800">添加需要压缩的图片</text>
    <text x="445" y="447" text-anchor="middle" class="softLight" font-size="11" font-weight="600">支持 JPG、PNG、WebP</text>
    <text x="445" y="466" text-anchor="middle" class="softLight" font-size="11" font-weight="600">单次最多 20 张，每张不超过 5 MB</text>
    <rect x="372" y="490" width="146" height="48" rx="15" fill="#ff6b8f"/>
    <use xlink:href="#i-plus" x="394" y="505" width="18" height="18" style="color:#fff"/>
    <text x="429" y="520" class="white" font-size="13" font-weight="800">选择图片</text>

    <text x="266" y="610" class="sectionTitle">压缩策略</text>
    <text x="621" y="609" text-anchor="end" class="tiny bold muted">上传前可调整</text>
    <rect x="264" y="624" width="362" height="72" rx="17" fill="#fff" stroke="#dce5f7"/>
    <rect x="268" y="628" width="175" height="64" rx="13" fill="#e3e9ff"/>
    <text x="356" y="653" text-anchor="middle" fill="#344fc9" font-size="11" font-weight="800">智能压缩</text>
    <text x="356" y="672" text-anchor="middle" fill="#536dcc" class="tiny medium">体积与画质平衡</text>
    <text x="533" y="653" text-anchor="middle" class="small bold muted">优先画质</text>
    <text x="533" y="672" text-anchor="middle" class="tiny medium muted">保留更多细节</text>

    <rect x="264" y="710" width="362" height="66" rx="15" fill="#fff" fill-opacity=".7" stroke="#dce5f7"/>
    <use xlink:href="#i-lock" x="278" y="729" width="18" height="18" style="color:#1db991"/>
    <text x="308" y="733" class="small medium muted">图片经安全通道发送至 TinyPNG，压缩完成后</text>
    <text x="308" y="751" class="small medium muted">自动清理临时文件。</text>
  </g>

