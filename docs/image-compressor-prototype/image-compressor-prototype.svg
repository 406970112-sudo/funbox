<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1024" viewBox="0 0 1440 1024">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#4b6bff" stroke-opacity=".055"/>
    </pattern>
    <filter id="phoneShadow" x="-30%" y="-20%" width="160%" height="170%">
      <feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#2d4375" flood-opacity=".24"/>
    </filter>
    <filter id="buttonShadow" x="-20%" y="-60%" width="140%" height="220%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#4b6bff" flood-opacity=".25"/>
    </filter>
    <clipPath id="screenA"><rect x="249" y="145" width="392" height="819" rx="32"/></clipPath>
    <clipPath id="screenB"><rect x="799" y="145" width="392" height="819" rx="32"/></clipPath>
    <clipPath id="thumbA"><rect x="826" y="558" width="58" height="58" rx="12"/></clipPath>
    <clipPath id="thumbB"><rect x="826" y="649" width="58" height="58" rx="12"/></clipPath>
    <clipPath id="thumbC"><rect x="826" y="740" width="58" height="58" rx="12"/></clipPath>
    <style>
      text { font-family: "Microsoft YaHei", "DengXian", sans-serif; fill: #18233d; letter-spacing: 0; }
      .latin { font-family: "Bahnschrift", "Microsoft YaHei", sans-serif; }
      .boardTitle { font-size: 29px; font-weight: 800; }
      .boardSub { font-size: 12px; font-weight: 600; fill: #7483a2; }
      .meta { font-size: 10px; font-weight: 700; fill: #7483a2; }
      .state { font-size: 12px; font-weight: 800; }
      .pageTitle { font-size: 18px; font-weight: 800; }
      .label { font-size: 10px; font-weight: 700; fill: #7483a2; }
      .sectionTitle { font-size: 13px; font-weight: 800; }
      .small { font-size: 10px; }
      .tiny { font-size: 8px; }
      .muted { fill: #7483a2; }
      .white { fill: #fff; }
      .blue { fill: #4b6bff; }
      .green { fill: #16876c; }
      .softLight { fill: #aeb8d9; }
      .lime { fill: #c9f36a; }
      .bold { font-weight: 800; }
      .medium { font-weight: 600; }
      .icon { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }
    </style>
    <symbol id="i-back" viewBox="0 0 24 24"><path class="icon" d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect class="icon" x="3" y="5" width="18" height="14" rx="2"/><circle class="icon" cx="9" cy="10" r="2"/><path class="icon" d="m4 17 4-4 3 3 3-4 6 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path class="icon" d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect class="icon" x="5" y="10" width="14" height="10" rx="2"/><path class="icon" d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path class="icon" d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path class="icon" d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path class="icon" d="M5 12h14M14 7l5 5-5 5"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><path class="icon" d="M4 7h16v13H4zM3 4h18v3H3zM9 11h6"/></symbol>
    <symbol id="i-loader" viewBox="0 0 24 24"><path class="icon" d="M12 3a9 9 0 1 1-8.5 6"/></symbol>
  </defs>

  <rect width="1440" height="1024" fill="#dfe8f8"/>
  <rect width="1440" height="1024" fill="url(#grid)"/>
  <rect width="1440" height="10" fill="#151b3b"/>

  <g transform="translate(64 38)">
    <rect width="42" height="42" rx="8" fill="#151b3b"/>
    <text x="21" y="28" text-anchor="middle" class="latin white" font-size="20" font-weight="800">F</text>
    <text x="56" y="23" class="boardTitle">图片压缩</text>
    <text x="56" y="43" class="boardSub">FunBox / TinyPNG 批量压缩工作流</text>
  </g>
  <g transform="translate(966 48)">
    <circle cx="5" cy="5" r="5" fill="#1db991"/><text x="17" y="9" class="meta">密钥仅保留在服务端</text>
    <circle cx="153" cy="5" r="5" fill="#4b6bff"/><text x="165" y="9" class="meta">390 × 822 主界面</text>
    <circle cx="285" cy="5" r="5" fill="#ff6b8f"/><text x="297" y="9" class="meta">上传 / 完成双状态</text>
  </g>

  <g>
    <rect x="248" y="100" width="22" height="22" rx="6" fill="#151b3b"/><text x="259" y="115" text-anchor="middle" class="latin tiny bold white">01</text>
    <text x="279" y="116" class="state">上传与压缩策略</text>
    <rect x="798" y="100" width="22" height="22" rx="6" fill="#151b3b"/><text x="809" y="115" text-anchor="middle" class="latin tiny bold white">02</text>
    <text x="829" y="116" class="state">压缩完成与批量下载</text>
  </g>

  <g filter="url(#phoneShadow)">
    <rect x="240" y="136" width="410" height="838" rx="40" fill="#10162f"/>
    <rect x="790" y="136" width="410" height="838" rx="40" fill="#10162f"/>
  </g>
  <rect x="249" y="145" width="392" height="819" rx="32" fill="#eef4ff"/>
  <rect x="799" y="145" width="392" height="819" rx="32" fill="#eef4ff"/>
  <rect x="394" y="153" width="102" height="24" rx="12" fill="#080d20"/>
  <rect x="944" y="153" width="102" height="24" rx="12" fill="#080d20"/>

  <!-- Upload state -->
  <g clip-path="url(#screenA)">
    <text x="273" y="174" class="latin tiny bold">9:41</text>
    <g stroke="#18233d" stroke-width="1.6" stroke-linecap="round">
      <path d="M591 169v4M596 167v6M601 165v8"/><path d="M608 168q6-6 12 0M611 171q3-3 6 0"/><rect x="625" y="165" width="13" height="8" rx="2" fill="none"/><path d="M638 168h2"/>
    </g>

    <use xlink:href="#i-back" x="265" y="194" width="22" height="22" style="color:#18233d"/>
    <text x="445" y="211" text-anchor="middle" class="pageTitle">图片压缩</text>
    <text x="621" y="210" text-anchor="end" class="small bold blue">记录</text>

