    <use xlink:href="#i-check" x="1119" y="272" width="24" height="24" style="color:#173a35"/>
    <path d="M834 349h322" stroke="#fff" stroke-opacity=".13"/>
    <path d="M941 365v59M1048 365v59" stroke="#fff" stroke-opacity=".13"/>
