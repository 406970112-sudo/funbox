      <h3>奖池金额效果</h3>
      <div class="fd-demo-controls"><button type="button" data-amount="44">¥44</button><button type="button" data-amount="120">¥120</button><button type="button" data-amount="360">¥360</button><button type="button" data-amount="800">¥800</button></div>
      <h3>其他状态</h3>
      <div class="fd-demo-controls"><button type="button" data-demo="cap">封顶后三圈</button><button type="button" data-demo="offline">网络中断</button><button type="button" data-demo="normal">恢复普通状态</button></div>
      <div class="fd-demo-legend"><span>本人：横幅＋座位＋行动区</span><span>他人：名字＋座位号＋下一位</span><span>奖池：金额＋有限筹码层次</span><span>动效：短暂反馈，可减少动态</span></div>
    </aside>
  </div>
</div>
<style>

x;font-size:11px}#funbox-ui-motion summary{color:#617398;cursor:pointer;padding:3px 0}#funbox-ui-motion .fd-detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e7edf7}#funbox-ui-motion .fd-action-area{margin-top:15px;background:#fff;border-radius:16px;padding:12px}#funbox-ui-motion .fd-action-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-size:12px;font-weight:700}#funbox-ui-motion .fd-action-title small{font-weight:400}#funbox-ui-motion .fd-button{border:0;border-radius:11px;padding:12px 9px;color:#fff;background:#2d5bff;font-weight:700;min-height:44px;width:100%}#funbox-ui-motion .fd-button small{color:inherit;opacity:.8;display:block;font-size:11px;font-weight:400}#funbox-ui-motion .fd-button-secondary{background:#edf3ff;color:#2d5bff}#funbox-ui-motion .fd-button-row{display:grid;grid-template-columns:1.6fr 1fr;gap:8px}#funbox-ui-motion .fd-low-actions{display:flex;gap:14px;justify-content:center;margin-top:7px}#funbox-ui-motion .fd-text-button{background:transparent;border:0;color:#718099;font-size:11px;padding:7px 9px;min-height:32px}#funbox-ui-motion .fd-wait-area{text-align:center;padding:7px 0;color:#718099;font-size:12px}#funbox-ui-motion .fd-wait-area strong{display:block;color:#172139;font-size:14px;margin-bottom:3px}#funbox-ui-motion .fd-feedback{min-height:21px;text-align:center;font-size:11px;color:#278461;margin-top:7px}#funbox-ui-motion .fd-homebar{height:4px;width:102px;background:#172139;border-radius:7px;margin:5px auto 10px;opacity:.75}#funbox-ui-motion .fd-demo{padding-top:26px;color:light-dark(#172139,#edf2ff);font-size:12px}#funbox-ui-motion .fd-demo-kicker{color:light-dark(#718099,#acbad1);font-size:11px;letter-spacing:1px;margin-bottom:22px}#funbox-ui-motion .fd-demo h3{font-size:13px;margin:19px 0 8px}#funbox-ui-motion .fd-demo-controls{display:flex;gap:7px;flex-wrap:wrap}#funbox-ui-motion .fd-demo-controls button{padding:8px 10px;border:1px solid light-dark(#dce4f3,#46536a);border-radius:8px;background:light-dark(#fff,#273247);color:inherit;font-size:12px;min-height:36px}#funbox-ui-motion .fd-demo-legend{display:flex;flex-direction:column;gap:9px;color:light-dark(#718099,#acbad1);font-size:11px;margin-top:25px}#funbox-ui-motion #fd-settings{margin-top:12px;padding:15px;border:1px solid #dce6fa;border-radius:15px;background:#fff}#funbox-ui-motion .fd-setting{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:10px 0;border-bottom:1px solid #edf1f8;gap:8px}#funbox-ui-motion input[type=checkbox]{accent-color:#2d5bff;width:17px;height:17px}#funbox-ui-motion .fd-delta{position:absolute;left:100%;top:0;white-space:nowrap;color:#278461!important;font-size:13px!important;font-weight:700;padding-left:8px;pointer-events:none}#funbox-ui-motion .fd-entrance{animation:fd-turn-attention .65s ease-out 2}#funbox-ui-motion .fd-bump{animation:fd-pot-bump .28s ease-out}#funbox-ui-motion .fd-flight{animation:fd-score-flight .7s ease-out both}@keyframes fd-turn-attention{0%,100%{box-shadow:0 0 0 0 #2d5bff00}40%{box-shadow:0 0 0 5px #2d5bff24}}@keyframes fd-pot-bump{0%{transform:scale(1)}45%{transform:scale(1.045)}100%{transform:scale(1)}}@keyframes fd-score-flight{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
@media(max-width:570px){#funbox-ui-motion .fd-stage{grid-template-columns:minmax(0,390px);padding:12px 0;gap:0;justify-content:center}#funbox-ui-motion .fd-demo{padding:16px 10px 0}#funbox-ui-motion .fd-demo-controls{gap:6px}#funbox-ui-motion .fd-demo h3{margin-top:12px}#funbox-ui-motion .fd-demo-legend{margin-top:15px}#funbox-ui-motion .fd-demo-kicker{margin-bottom:9px}}@media(prefers-reduced-motion:reduce){#funbox-ui-motion *{animation:none!important;transition:none!important}}

<script>
(()=>{
const root=document.getElementById('funbox-ui-motion'), get=id=>root.querySelector('#'+id);
const names=['小林','阿杰','小周','阿宁','老王','小陈','阿明','小赵'];
const state={actor:0,points:88,paid:[11,21,11,1,11,11,11,11],cap:false,offline:false,busy:false,reminded:false,settings:false,selfSeen:false,selfOut:false,decision:null,reduced:matchMedia('(prefers-reduced-motion: reduce)').matches,chips:true,vibration:true,sound:false};
let actionVersion=0,flightTimer;
function money(points){return '¥'+(points*.5).toFixed(2);}
function nextSeat(i){do{i=(i+1)%8;}while(i===3||(state.selfOut&&i===0));return i;}
function myFollow(){return (state.cap?20:10)*(state.selfSeen?2:1);}
function decisionMarkup(){
if(state.decision==='raise')return `<div class="fd-action-title">提高基准单注</div><div class="fd-wait-area">基准由 10 分加到 20 分<br>你本次投入 ${20*(state.selfSeen?2:1)} 分（${money(20*(state.selfSeen?2:1))}）<br>到顶后最多继续 3 圈</div><button type="button" class="fd-button" data-action="confirmraise">确认加注</button><button type="button" class="fd-text-button" data-action="canceldecision">返回</button>`;
if(state.decision==='fold')return `<div class="fd-action-title">确定本场弃牌？</div><div class="fd-wait-area">已投入 ${state.paid[0]} 分保留在积分池<br>本场不再行动，仍参与本场喜钱</div><button type="button" class="fd-button" style="background:#ff765e" data-action="confirmfold">确认弃牌</button><button type="button" class="fd-text-button" data-action="canceldecision">继续本场</button>`;
return '';
}
function actorHighlight(){if(!state.reduced&&state.actor===0&&!state.offline){get('fd-turn').classList.remove('fd-entrance');requestAnimationFrame(()=>get('fd-turn').classList.add('fd-entrance'));}}
function renderChips(){const amount=state.points*.5,count=amount<50?3:amount<200?5:amount<500?7:8;get('fd-chips').innerHTML=state.chips?Array.from({length:count},(_,i)=>`<span class="fd-chip ${i%3===2?'fd-chip-coral':''}" style="left:${i%2?48:12}px;bottom:${10+Math.floor(i/2)*13}px;z-index:${i}">${i%3===2?'−':'+'}</span>`).join(''):'';}
function render(){
const mine=state.actor===0,actor=names[state.actor],follow=myFollow();
get('fd-turn').className='fd-turn'+(state.offline?' fd-offline':mine?'':' fd-waiting');
get('fd-turn').innerHTML=`<span class="fd-turn-icon">${state.offline?'!':mine?'→':state.actor+1}</span><div><strong>${state.offline?'网络中断，操作已暂停':mine?'轮到你了，小林':`轮到${actor}了 · ${state.actor+1}号位`}</strong><small>${state.offline?'保留最近确认的分数，连接恢复后继续':mine?'选择跟注或加注，分数会同步给全桌':`下一位：${names[nextSeat(state.actor)]} · 全桌同步可见`}</small></div>`;
get('fd-points').textContent=state.points;get('fd-money').textContent=money(state.points);renderChips();
get('fd-cap').textContent=state.cap?'已封顶 · 后续第 1/3 圈 · 本圈还需 7 人行动':'封顶前不限圈数 · 到顶后最多再走 3 圈';get('fd-cap').classList.toggle('fd-atcap',state.cap);get('fd-base').textContent=(state.cap?20:10)+' 分';get('fd-follow').textContent=follow+' 分';get('fd-sync').textContent=state.offline?'● 等待重连':state.busy?'● 正在同步':'● 已同步';get('fd-sync').style.color=state.offline?'#b65341':state.busy?'#718099':'#278461';
get('fd-seats').innerHTML=names.map((name,i)=>`<div class="fd-seat ${i===state.actor?'fd-current':''} ${i===3||(i===0&&state.selfOut)?'fd-out':''}" ${i===state.actor?'aria-current="true"':''}><div class="fd-seat-top"><span>${i+1}号</span><span>${i===state.actor?'行动中':i===3||(i===0&&state.selfOut)?'出局':i===0?'我':'在局'}</span></div><div class="fd-seat-name">${name}</div><div class="fd-seat-state">${i===3||(i===0&&state.selfOut)?'已弃牌':i===1||(i===0&&state.selfSeen)?'已看 · 2倍':'闷牌 · 1倍'}</div><div class="fd-seat-score">${state.paid[i]}<span> 分</span></div></div>`).join('');
get('fd-details').innerHTML=names.map((name,i)=>`<div class="fd-detail-row"><span>${i+1}号 ${name}${i===3?' · 已弃牌':''}</span><span>${state.paid[i]} 分 / ${money(state.paid[i])}</span></div>`).join('');
get('fd-roster-count').textContent='8 人入座 · '+(state.selfOut?6:7)+' 人在局';
get('fd-actions').innerHTML=state.decision?decisionMarkup():state.offline?'<div class="fd-wait-area"><strong>连接恢复后继续</strong>尚未提交的操作不会计入奖池</div>':mine?`<div class="fd-action-title">我的回合<small>${state.selfSeen?'已看 · 2 倍':'闷牌 · 1 倍'}</small></div><div class="fd-button-row"><button type="button" class="fd-button" data-action="follow" ${state.busy?'disabled':''}>${state.busy?'同步中…':'跟注 '+follow+' 分'}<small>${money(follow)}</small></button><button type="button" class="fd-button fd-button-secondary" data-action="raise" ${state.cap||state.busy?'disabled':''}>加注</button></div><div class="fd-low-actions"><button type="button" class="fd-text-button" data-action="look" ${state.busy||state.selfSeen?'disabled':''}>${state.selfSeen?'已看牌':'我已看牌'}</button><button type="button" class="fd-text-button" data-action="fold" ${state.busy?'disabled':''}>弃牌</button></div>`:`<div class="fd-wait-area"><strong>等待${actor}行动</strong>下一位：${names[nextSeat(state.actor)]}</div><button type="button" class="fd-text-button" style="display:block;margin:auto" data-action="remind" ${state.reminded?'disabled':''}>${state.reminded?'已提醒，稍等一下':'提醒一次'}</button>`;
get('fd-settings').hidden=!state.settings;if(state.settings)get('fd-settings').innerHTML=`<div class="fd-action-title">提示与反馈<button type="button" class="fd-text-button" data-action="settings">收起</button></div>${[['vibration','轮到我时轻震'],['sound','提示音'],['reduced','减少动态'],['chips','显示奖池动效']].map(([key,label])=>`<label class="fd-setting"><span>${label}</span><input type="checkbox" data-setting="${key}" ${state[key]?'checked':''}></label>`).join('')}`;
}
function feedback(text){get('fd-feedback').textContent=text;}
function bump(delta){if(state.reduced)return;get('fd-money').classList.remove('fd-bump');get('fd-chips').classList.remove('fd-bump');get('fd-delta').classList.remove('fd-flight');requestAnimationFrame(()=>{get('fd-money').classList.add('fd-bump');if(state.chips)get('fd-chips').classList.add('fd-bump');get('fd-delta').textContent=delta>0?'+'+delta+' 分':'';get('fd-delta').classList.add('fd-flight');});clearTimeout(flightTimer);flightTimer=setTimeout(()=>get('fd-delta').textContent='',750);}
root.addEventListener('click',e=>{const el=e.target.closest('button');if(!el||el.disabled)return;
if(el.dataset.demo){actionVersion++;state.busy=false;state.reminded=false;state.offline=false;state.decision=null;const key=el.dataset.demo;if(key==='mine'){state.actor=0;state.selfOut=false;}if(key==='other')state.actor=1;if(key==='next')state.actor=nextSeat(state.actor);if(key==='cap')state.cap=true;if(key==='offline')state.offline=true;if(key==='normal'){state.cap=false;state.actor=0;}feedback('');render();actorHighlight();return;}
if(el.dataset.amount){actionVersion++;state.busy=false;const previous=state.points;state.points=Number(el.dataset.amount)*2;const unit=Math.floor((state.points-1)/7);state.paid=names.map((_,i)=>i===3?1:unit);state.paid[0]+=state.points-state.paid.reduce((a,n)=>a+n,0);render();bump(state.points-previous);feedback('');return;}
const action=el.dataset.action;if(action==='settings'){state.settings=!state.settings;render();return;}
if(action==='remind'){state.reminded=true;render();feedback('已提醒 '+names[state.actor]+'，请稍候');return;}
if(action==='follow'&&state.actor===0&&!state.busy&&!state.offline){const version=++actionVersion,points=myFollow();state.busy=true;render();setTimeout(()=>{if(version!==actionVersion||state.offline)return;state.points+=points;state.paid[0]+=points;state.busy=false;state.actor=nextSeat(state.actor);render();bump(points);feedback('小林跟注 '+points+' 分，已同步 · 现在轮到阿杰');},450);return;}
if(action==='raise'||action==='fold'){state.decision=action;render();return;}
if(action==='canceldecision'){state.decision=null;render();return;}
if(action==='look'){state.selfSeen=true;render();feedback('已看牌，之后按 2 倍跟注，之前投入不追补');return;}
if(action==='confirmfold'){state.selfOut=true;state.decision=null;state.actor=nextSeat(0);render();feedback('小林已弃牌，轮到阿杰');return;}
if(action==='confirmraise'){const points=20*(state.selfSeen?2:1);state.cap=true;state.points+=points;state.paid[0]+=points;state.decision=null;state.actor=nextSeat(0);render();bump(points);feedback('已加到封顶，之后最多继续 3 圈');return;}
});
root.addEventListener('change',e=>{const key=e.target.dataset.setting;if(!key)return;state[key]=e.target.checked;render();});
render();actorHighlight();
})();
</script>
