name: Deploy main

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY repository secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS repository secret}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' \
            'Host *' \
            '  BatchMode yes' \
            '  ConnectTimeout 30' \
            '  ConnectionAttempts 3' \
            '  ServerAliveInterval 30' \
            '  ServerAliveCountMax 10' \
            '  TCPKeepAlive yes' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Sync source to server
        timeout-minutes: 10
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_RELEASE_DIR: /tmp/my-first-expo-app-${{ github.sha }}
        run: |
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST repository secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER repository secret}"
          ssh \
            -i ~/.ssh/deploy_key \
            -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "rm -rf '$REMOTE_RELEASE_DIR' && mkdir -p '$REMOTE_RELEASE_DIR/source'"
          bash deploy/alicloud/ubuntu-22.04/create-source-archive.sh "$RUNNER_TEMP/funbox-source.tar.gz"
          upload_ok=false
          for attempt in 1 2 3; do
            upload_started=$SECONDS
            if timeout --kill-after=15s 180s scp \
              -i ~/.ssh/deploy_key \
              -P "${DEPLOY_PORT:-22}" \
              "$RUNNER_TEMP/funbox-source.tar.gz" \
              "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_RELEASE_DIR/source.tar.gz.upload"; then
              echo "Source archive uploaded in $((SECONDS - upload_started))s (attempt $attempt/3)."
              upload_ok=true
              break
            fi
            echo "Source archive upload failed after $((SECONDS - upload_started))s (attempt $attempt/3); retrying shortly."
            sleep $((attempt * 5))
          done
          if [[ "$upload_ok" != true ]]; then
            echo "Source archive upload failed after 3 attempts."
            exit 1
          fi
          ssh \
            -i ~/.ssh/deploy_key \
            -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mv '$REMOTE_RELEASE_DIR/source.tar.gz.upload' '$REMOTE_RELEASE_DIR/source.tar.gz' && tar -xzf '$REMOTE_RELEASE_DIR/source.tar.gz' -C '$REMOTE_RELEASE_DIR/source' && rm -f '$REMOTE_RELEASE_DIR/source.tar.gz'"

      - name: Configure TinyPNG secret
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_RELEASE_DIR: /tmp/my-first-expo-app-${{ github.sha }}
          TINYPNG_API_KEY: ${{ secrets.TINYPNG_API_KEY }}
        run: |
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST repository secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER repository secret}"
          : "${TINYPNG_API_KEY:?Missing TINYPNG_API_KEY repository secret}"
          printf '%s\n' "$TINYPNG_API_KEY" | ssh \
            -i ~/.ssh/deploy_key \
            -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n bash '$REMOTE_RELEASE_DIR/source/deploy/alicloud/ubuntu-22.04/configure-tinypng-secret.sh'"

      - name: Configure Stock alert SendKey
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_RELEASE_DIR: /tmp/my-first-expo-app-${{ github.sha }}
          STOCK_ALERT_SENDKEY: ${{ secrets.STOCK_ALERT_SENDKEY }}
        run: |
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST repository secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER repository secret}"
          if [[ -z "${STOCK_ALERT_SENDKEY:-}" ]]; then
            echo "STOCK_ALERT_SENDKEY repository secret not set; skipping ServerChan configuration."
            exit 0
          fi
          printf '%s\n' "$STOCK_ALERT_SENDKEY" | ssh \
            -i ~/.ssh/deploy_key \
            -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n bash '$REMOTE_RELEASE_DIR/source/deploy/alicloud/ubuntu-22.04/configure-stock-alert-secret.sh'"

      - name: Configure WeChat mini program secret
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_RELEASE_DIR: /tmp/my-first-expo-app-${{ github.sha }}
          WECHAT_MINIPROGRAM_APP_SECRET: ${{ secrets.WECHAT_MINIPROGRAM_APP_SECRET }}
        run: |
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST repository secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER repository secret}"
          if [[ -z "${WECHAT_MINIPROGRAM_APP_SECRET:-}" ]]; then
            echo "WECHAT_MINIPROGRAM_APP_SECRET repository secret not set; external mini program codes will be disabled."
            exit 0
          fi
          printf '%s\n' "$WECHAT_MINIPROGRAM_APP_SECRET" | ssh \
            -i ~/.ssh/deploy_key \
            -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n bash '$REMOTE_RELEASE_DIR/source/deploy/alicloud/ubuntu-22.04/configure-wechat-miniprogram-secret.sh'"

      - name: Prune stale releases
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_RELEASE_DIR: /tmp/my-first-expo-app-${{ github.sha }}
        run: |
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST repository secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER repository secret}"
          ssh \
            -i ~/.ssh/deploy_key \
            -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n env RELEASES_ROOT=/srv/my-first-expo-app-releases CURRENT_LINK=/srv/my-first-expo-app-current bash '$REMOTE_RELEASE_DIR/source/deploy/alicloud/ubuntu-22.04/prune-releases.sh'"

      - name: Update production server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_RELEASE_DIR: /tmp/my-first-expo-app-${{ github.sha }}
        run: |
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST repository secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER repository secret}"
          ssh \
            -i ~/.ssh/deploy_key \
            -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n bash -lc 'set -Eeuo pipefail; APP_ROOT=/srv/my-first-expo-app-releases/${{ github.sha }}; mkdir -p \"\$APP_ROOT\"; rsync -a --delete --exclude=.git/ \"$REMOTE_RELEASE_DIR/source/\" \"\$APP_ROOT/\"; cp /srv/my-first-expo-app-current/frontend/.env \"\$APP_ROOT/frontend/.env\" 2>/dev/null || cp /srv/my-first-expo-app/frontend/.env \"\$APP_ROOT/frontend/.env\"; cp /srv/my-first-expo-app-current/backend/.env \"\$APP_ROOT/backend/.env\" 2>/dev/null || cp /srv/my-first-expo-app/backend/.env \"\$APP_ROOT/backend/.env\"; cp /srv/my-first-expo-app-current/email-agent/backend/.env \"\$APP_ROOT/email-agent/backend/.env\"; cd \"\$APP_ROOT\"; CORS_ALLOWED_ORIGINS_OVERRIDE=https://xwhub.cn,https://www.xwhub.cn PERSISTENT_ROOT=/srv/my-first-expo-app-shared PREVIOUS_APP_ROOT=/srv/my-first-expo-app-current PUBLIC_FRONTEND_URL=https://www.xwhub.cn APP_ROOT=\"\$APP_ROOT\" SKIP_GIT_UPDATE=1 DEPLOY_COMMIT=${{ github.sha }} BRANCH=main bash deploy/alicloud/ubuntu-22.04/update-server.sh; ln -sfn \"\$APP_ROOT\" /srv/my-first-expo-app-current; rm -rf \"$REMOTE_RELEASE_DIR\"'"

      - name: Verify production release
        run: |
          node deploy/alicloud/ubuntu-22.04/verify-production-release.mjs \
            https://www.xwhub.cn \
            "${{ github.sha }}" \
            10 \
            3000
